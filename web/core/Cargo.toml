[package]
name = "p99lfg-core"
version = "0.1.0"
edition = "2021"
description = "Portable core for the p99lfg web/extension shells: Nostr keys/events, NIP-04 DMs, LFG + rating logic. Transliterated from the C core (src/)."

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
k256 = { version = "0.13", default-features = false, features = ["arithmetic", "schnorr", "std"] }
sha2 = "0.10"
aes = "0.8"
cbc = "0.1"
cipher = { version = "0.4", features = ["block-padding", "alloc"] }
base64 = "0.22"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.8"
getrandom = { version = "0.2", features = ["js"] }

[profile.release]
opt-level = "z"
lto = true
panic = "abort"
